<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Anggota - UPU-CC</title>

  <!-- SEO Tags -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/jpeg" href="/logo.jpg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background-color: #f8fafc; font-family: 'Outfit', sans-serif; }
    .dashboard-header {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      color: white;
      padding: 40px 0 60px;
      position: relative;
    }
    .nav-pills .nav-link {
        color: #475569;
        font-weight: 500;
        border-radius: 10px;
        padding: 12px 20px;
        margin-bottom: 8px;
    }
    .nav-pills .nav-link.active {
        background-color: #2563eb;
        color: white;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }
    .nav-pills .nav-link:hover:not(.active) {
        background-color: #e2e8f0;
    }
    .content-card {
        background: white;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        padding: 30px;
        border: none;
        min-height: 400px;
    }
    .material-item {
        border-left: 4px solid #3b82f6;
        background-color: #f8fafc;
        border-radius: 8px;
        transition: transform 0.2s;
    }
    .material-item:hover {
        transform: translateX(5px);
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #0f172a;">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/">
      <img src="/logo.jpg" alt="Logo UPU-CC" height="30" class="me-2 rounded-circle"> UPU-CC
    </a>
    <div class="d-flex align-items-center gap-3">
        <a href="/member/profil.html" class="btn btn-sm btn-outline-light"><i class="bi bi-person"></i> Profil</a>
        <button class="btn btn-sm btn-danger" id="btnLogout"><i class="bi bi-box-arrow-right"></i> Logout</button>
    </div>
  </div>
</nav>

<div class="dashboard-header">
  <div class="container">
    <h2 class="fw-bold mb-1">Dashboard Member</h2>
    <p class="opacity-75" id="welcomeMsg">Selamat datang, Member!</p>
  </div>
</div>

<div class="container" style="margin-top: -30px; position: relative; z-index: 10;">
  <div class="row">
    <!-- Sidebar Navigation -->
    <div class="col-lg-3 mb-4">
        <div class="bg-white p-3 rounded-4 shadow-sm">
            <div class="nav flex-column nav-pills" id="v-pills-tab" role="tablist" aria-orientation="vertical">
                <button class="nav-link active text-start" id="v-pills-materi-tab" data-bs-toggle="pill" data-bs-target="#v-pills-materi" type="button" role="tab">
                    <i class="bi bi-book me-2"></i> Materi Belajar
                </button>
                <button class="nav-link text-start" id="v-pills-sertifikat-tab" data-bs-toggle="pill" data-bs-target="#v-pills-sertifikat" type="button" role="tab">
                    <i class="bi bi-award me-2"></i> E-Certificate
                </button>
                <button class="nav-link text-start" id="v-pills-jadwal-tab" data-bs-toggle="pill" data-bs-target="#v-pills-jadwal" type="button" role="tab">
                    <i class="bi bi-calendar3 me-2"></i> Jadwal Divisi
                </button>
                <a href="/member/evoting.html" class="nav-link text-start text-decoration-none mt-2">
                    <i class="bi bi-box me-2"></i> E-Voting
                </a>
                <a href="/member/scan.html" class="nav-link text-start text-decoration-none mt-2 border-top pt-3">
                    <i class="bi bi-qr-code-scan me-2"></i> Absensi QR Code
                </a>
            </div>
        </div>
    </div>

    <!-- Content Area -->
    <div class="col-lg-9">
        <div class="tab-content content-card" id="v-pills-tabContent">
            
            <!-- Materi Tab -->
            <div class="tab-pane fade show active" id="v-pills-materi" role="tabpanel">
                <h4 class="fw-bold mb-4 border-bottom pb-2">Materi Pembelajaran</h4>
                <div id="materiList">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="mt-2 text-muted">Memuat materi...</p>
                    </div>
                </div>
            </div>

            <!-- Sertifikat Tab -->
            <div class="tab-pane fade" id="v-pills-sertifikat" role="tabpanel">
                <h4 class="fw-bold mb-4 border-bottom pb-2">E-Certificate Saya</h4>
                <div class="row g-3" id="sertifikatList">
                    <div class="text-center py-5 w-100">
                        <p class="text-muted">Memuat sertifikat...</p>
                    </div>
                </div>
            </div>

            <!-- Jadwal Tab -->
            <div class="tab-pane fade" id="v-pills-jadwal" role="tabpanel">
                <h4 class="fw-bold mb-4 border-bottom pb-2">Jadwal Divisi</h4>
                <div id="jadwalList">
                    <div class="text-center py-5">
                        <p class="text-muted">Memuat jadwal...</p>
                    </div>
                </div>
            </div>

        </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/src/member/dashboard.js"></script>
</body>
</html>
