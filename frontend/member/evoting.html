<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Voting - UPU-CC</title>

  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/jpeg" href="/logo.jpg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background-color: #f8fafc; font-family: 'Outfit', sans-serif; }
    .dashboard-header {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      color: white;
      padding: 40px 0 60px;
      position: relative;
    }
    .nav-pills .nav-link {
        color: #475569;
        font-weight: 500;
        border-radius: 10px;
        padding: 12px 20px;
        margin-bottom: 8px;
    }
    .nav-pills .nav-link.active {
        background-color: #2563eb;
        color: white;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }
    .nav-pills .nav-link:hover:not(.active) {
        background-color: #e2e8f0;
    }
    .content-card {
        background: white;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        padding: 30px;
        border: none;
        min-height: 400px;
    }
    
    .candidate-card {
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      overflow: hidden;
      transition: all 0.3s ease;
      background: #fff;
    }
    .candidate-card:hover {
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      transform: translateY(-5px);
    }
    .candidate-photo {
      width: 100%;
      height: 250px;
      object-fit: cover;
      background: #f1f5f9;
    }
    .no-urut {
      position: absolute;
      top: 15px;
      left: 15px;
      background: #ef4444;
      color: white;
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 1.5rem;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(239, 68, 68, 0.4);
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #0f172a;">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/">
      <img src="/logo.jpg" alt="Logo UPU-CC" height="30" class="me-2 rounded-circle"> UPU-CC
    </a>
    <div class="d-flex align-items-center gap-3">
        <a href="/member/profil.html" class="btn btn-sm btn-outline-light"><i class="bi bi-person"></i> Profil</a>
        <button class="btn btn-sm btn-danger" id="btnLogout"><i class="bi bi-box-arrow-right"></i> Logout</button>
    </div>
  </div>
</nav>

<div class="dashboard-header">
  <div class="container">
    <h2 class="fw-bold mb-1">Pemilu Raya (E-Voting)</h2>
    <p class="opacity-75">Tentukan masa depan UPU-CC dengan hak suara Anda.</p>
  </div>
</div>

<div class="container" style="margin-top: -30px; position: relative; z-index: 10;">
  <div class="row">
    <!-- Sidebar Navigation -->
    <div class="col-lg-3 mb-4">
        <div class="bg-white p-3 rounded-4 shadow-sm">
            <div class="nav flex-column nav-pills" id="v-pills-tab" role="tablist" aria-orientation="vertical">
                <a href="/member/dashboard.html" class="nav-link text-start text-decoration-none">
                    <i class="bi bi-book me-2"></i> Dashboard Utama
                </a>
                <a href="/member/evoting.html" class="nav-link active text-start text-decoration-none mt-2">
                    <i class="bi bi-box me-2"></i> E-Voting
                </a>
                <a href="/member/scan.html" class="nav-link text-start text-decoration-none mt-2 border-top pt-3">
                    <i class="bi bi-qr-code-scan me-2"></i> Absensi QR Code
                </a>
            </div>
        </div>
    </div>

    <!-- Content Area -->
    <div class="col-lg-9">
        <div class="content-card">
          <div id="votingStatusContainer" class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-3">Memeriksa status Pemilu...</p>
          </div>
          
          <div id="votingActiveContainer" style="display: none;">
            <div class="alert alert-info border-0 rounded-4 d-flex align-items-center mb-4">
              <i class="bi bi-info-circle-fill fs-4 me-3 text-primary"></i>
              <div>
                <h6 class="fw-bold mb-0">Perhatian</h6>
                <p class="mb-0 small">Anda hanya dapat memberikan suara 1 (satu) kali. Pilihan bersifat rahasia.</p>
              </div>
            </div>
            
            <h4 class="fw-bold text-center mb-4" id="displayElectionTitle">Pemilu UPU-CC</h4>
            
            <div class="row g-4 justify-content-center" id="candidatesList">
              <!-- Candidates injected here -->
            </div>
          </div>
        </div>
    </div>
  </div>
</div>

<!-- Modal Detail -->
<div class="modal fade" id="modalDetail" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content rounded-4 border-0">
      <div class="modal-header border-0 pb-0">
        <h5 class="fw-bold modal-title" id="modalCandName">Nama Kandidat</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4">
        <h6 class="fw-bold text-primary">Visi</h6>
        <p id="modalCandVision" class="text-muted"></p>
        <h6 class="fw-bold text-primary mt-4">Misi</h6>
        <p id="modalCandMission" class="text-muted" style="white-space: pre-wrap;"></p>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal">Tutup</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/src/member/evoting.js"></script>
</body>
</html>
