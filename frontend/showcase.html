<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Showcase Karya - UPU-CC</title>

  <link rel="icon" type="image/jpeg" href="/logo.jpg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  
  <style>
    body { background-color: #0f172a; color: white; font-family: 'Outfit', sans-serif; }
    .showcase-header {
      padding: 80px 0 40px;
      text-align: center;
    }
    .filter-btn {
        background: transparent;
        border: 1px solid rgba(255,255,255,0.2);
        color: white;
        border-radius: 20px;
        padding: 8px 20px;
        margin: 5px;
        transition: 0.3s;
    }
    .filter-btn.active, .filter-btn:hover {
        background: #3b82f6;
        border-color: #3b82f6;
    }
    .project-card {
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 16px;
        overflow: hidden;
        transition: 0.4s;
    }
    .project-card:hover {
        transform: translateY(-10px);
        box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        border-color: rgba(255,255,255,0.2);
    }
    .project-img {
        height: 250px;
        width: 100%;
        object-fit: cover;
        border-bottom: 1px solid rgba(255,255,255,0.1);
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark border-bottom border-secondary pt-3 pb-3">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/">
      <img src="/logo.jpg" alt="Logo UPU-CC" height="30" class="me-2 rounded-circle"> UPU-CC
    </a>
    <a href="/" class="btn btn-sm btn-outline-light ms-auto"><i class="bi bi-house"></i> Beranda</a>
  </div>
</nav>

<div class="showcase-header">
  <div class="container">
    <h1 class="fw-bold mb-3 display-4">Galeri Karya <span class="text-primary">UPU-CC</span></h1>
    <p class="lead opacity-75">Mahakarya mahasiswa di bidang pemrograman, desain, dan jaringan.</p>
    
    <div class="mt-5">
        <button class="filter-btn active">Semua</button>
        <button class="filter-btn">Programming</button>
        <button class="filter-btn">Multimedia</button>
        <button class="filter-btn">NetSect</button>
    </div>
  </div>
</div>

<div class="container mb-5 pb-5">
    <div class="row g-4 mt-2" id="showcaseContainer">
        <div class="col-12 text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="text-muted mt-3">Memuat karya...</p>
        </div>
    </div>
</div>

<script type="module" src="/src/showcase.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
