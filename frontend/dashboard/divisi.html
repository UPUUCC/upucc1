  <!-- Main Content -->
  <div class="flex-grow-1 bg-light" style="margin-left: 250px; min-height: 100vh;">
    <div class="container-fluid p-4">

<p class="text-muted">4 divisi bersifat tetap (Programming, Net Sect, Knowtech, Multimedia). Anda dapat mengedit logo dan deskripsinya di sini.</p>

<div class="row g-3">
  
  <div class="col-md-6">
    <div class="card border-0 shadow-sm p-4">
      <div class="d-flex gap-3 align-items-center mb-3">
        <img src="<!-- Dynamic: $d['logo'] ? '../uploads/divisi/'.e($d['logo']) : 'https://via.placeholder.com/70?text='.e(substr($d['nama'],0,1)) -->" style="width:70px;height:70px;object-fit:contain;">
        <h5 class="mb-0"><!-- Dynamic: e($d['nama']) --></h5>
      </div>
      <form method="POST" enctype="multipart/form-data">
        <input type="hidden" name="action" value="edit">
        <input type="hidden" name="id" value="<!-- Dynamic: $d['id'] -->">
        <div class="mb-2">
          <label class="form-label small">Nama Divisi</label>
          <input type="text" name="nama" class="form-control" value="<!-- Dynamic: e($d['nama']) -->" required>
        </div>
        <div class="mb-2">
          <label class="form-label small">Logo Divisi</label>
          <input type="file" name="logo" class="form-control" accept="image/*">
        </div>
        <div class="mb-2">
          <label class="form-label small">Deskripsi / Informasi Divisi</label>
          <textarea name="deskripsi" class="form-control" rows="3"><!-- Dynamic: e($d['deskripsi']) --></textarea>
        </div>
        <div class="mb-2">
          <label class="form-label small">Sejarah Singkat Divisi</label>
          <textarea name="sejarah" class="form-control" rows="3"><!-- Dynamic: e($d['sejarah']) --></textarea>
        </div>
        <button class="btn btn-sm btn-primary"><i class="bi bi-save"></i> Simpan</button>
      </form>
    </div>
  </div>
  
</div>

    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
