<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin - UPUCC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<div class="d-flex">
  <!-- Sidebar -->
  <div class="bg-dark text-white p-3 vh-100 position-fixed" style="width: 250px; overflow-y:auto;">
    <h4 class="mb-4">Admin UPUCC</h4>
    <ul class="nav flex-column">
      <li class="nav-item"><a class="nav-link text-white" href="/dashboard/index.html">Dashboard</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="/dashboard/slider.html">Slider</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="/dashboard/informasi.html">Informasi UPUCC</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="/dashboard/divisi.html">Divisi</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="/dashboard/prestasi.html">Prestasi</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="/dashboard/struktur.html">Struktur</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="/dashboard/sejarah.html">Sejarah</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="/dashboard/acara.html">Acara</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="/dashboard/anggota.html">Anggota</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="/dashboard/pendaftaran.html">Pendaftaran</a></li>
      <li class="nav-item mt-4"><a class="nav-link text-danger" href="/dashboard/logout.html">Logout</a></li>
    </ul>
  </div>
  <!-- Main Content -->
  <div class="flex-grow-1 bg-light" style="margin-left: 250px; min-height: 100vh;">
    <div class="container-fluid p-4">

<div class="card border-0 shadow-sm p-4 mb-4">
  <h5>Tambah Postingan Acara Baru</h5>
  <form method="POST" enctype="multipart/form-data">
    <input type="hidden" name="action" value="add">
    <div class="mb-3"><label class="form-label">Judul *</label><input type="text" name="judul" class="form-control" required></div>
    <div class="mb-3"><label class="form-label">Deskripsi</label><textarea name="deskripsi" class="form-control" rows="3"></textarea></div>
    <div class="mb-3"><label class="form-label">Foto (bisa pilih beberapa sekaligus, seperti Instagram)</label>
      <input type="file" name="fotos[]" class="form-control" accept="image/*" multiple>
    </div>
    <button class="btn btn-primary"><i class="bi bi-plus"></i> Posting</button>
  </form>
</div>

<div class="card border-0 shadow-sm p-4 mb-3">
  <div class="d-flex justify-content-between">
    <h5><!-- Dynamic: e($a['judul']) --></h5>
    <div>
      <button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#editA<!-- Dynamic: $a['id'] -->"><i class="bi bi-pencil"></i> Edit Teks</button>
      <button class="btn btn-sm btn-outline-success" data-bs-toggle="modal" data-bs-target="#addFoto<!-- Dynamic: $a['id'] -->"><i class="bi bi-image"></i> Tambah Foto</button>
      <a href="?hapus=<!-- Dynamic: $a['id'] -->" class="btn btn-sm btn-outline-danger" onclick="return confirm('Hapus seluruh postingan ini beserta fotonya?')"><i class="bi bi-trash"></i> Hapus</a>
    </div>
  </div>
  <p class="text-muted small"><!-- Dynamic: tgl_indo(date('Y-m-d', strtotime($a['created_at']))) --></p>
  <p><!-- Dynamic: nl2br(e($a['deskripsi'])) --></p>
  <div class="d-flex flex-wrap gap-2">
    
    <div style="position:relative;">
      <img src="../uploads/acara/<!-- Dynamic: e($f['foto']) -->" style="width:100px;height:100px;object-fit:cover;border-radius:8px;">
      <a href="?hapus_foto=<!-- Dynamic: $f['id'] -->" onclick="return confirm('Hapus foto ini?')" class="btn btn-sm btn-danger" style="position:absolute;top:2px;right:2px;padding:0 6px;">&times;</a>
    </div>
    
    <p class="text-muted small">Belum ada foto.</p>
  </div>
</div>

<div class="modal fade" id="editA<!-- Dynamic: $a['id'] -->">
  <div class="modal-dialog"><div class="modal-content">
    <form method="POST">
      <input type="hidden" name="action" value="edit"><input type="hidden" name="id" value="<!-- Dynamic: $a['id'] -->">
      <div class="modal-header"><h5 class="modal-title">Edit Postingan</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div class="mb-2"><label class="form-label">Judul</label><input type="text" name="judul" class="form-control" value="<!-- Dynamic: e($a['judul']) -->" required></div>
        <div class="mb-2"><label class="form-label">Deskripsi</label><textarea name="deskripsi" class="form-control" rows="4"><!-- Dynamic: e($a['deskripsi']) --></textarea></div>
      </div>
      <div class="modal-footer"><button class="btn btn-primary">Simpan</button></div>
    </form>
  </div></div>
</div>

<div class="modal fade" id="addFoto<!-- Dynamic: $a['id'] -->">
  <div class="modal-dialog"><div class="modal-content">
    <form method="POST" enctype="multipart/form-data">
      <input type="hidden" name="action" value="add_foto"><input type="hidden" name="acara_id" value="<!-- Dynamic: $a['id'] -->">
      <div class="modal-header"><h5 class="modal-title">Tambah Foto</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <input type="file" name="fotos[]" class="form-control" accept="image/*" multiple required>
      </div>
      <div class="modal-footer"><button class="btn btn-primary">Upload</button></div>
    </form>
  </div></div>
</div>

    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
