<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin - UPUCC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<div class="d-flex">
  <!-- Sidebar -->
  <div class="bg-dark text-white p-3 vh-100 position-fixed" style="width: 250px; overflow-y:auto;">
    <h4 class="mb-4">Admin UPUCC</h4>
    <ul class="nav flex-column">
      <li class="nav-item"><a class="nav-link text-white" href="/dashboard/index.html">Dashboard</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="/dashboard/slider.html">Slider</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="/dashboard/informasi.html">Informasi UPUCC</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="/dashboard/divisi.html">Divisi</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="/dashboard/prestasi.html">Prestasi</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="/dashboard/struktur.html">Struktur</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="/dashboard/sejarah.html">Sejarah</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="/dashboard/acara.html">Acara</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="/dashboard/anggota.html">Anggota</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="/dashboard/pendaftaran.html">Pendaftaran</a></li>
      <li class="nav-item mt-4"><a class="nav-link text-danger" href="/dashboard/logout.html">Logout</a></li>
    </ul>
  </div>
  <!-- Main Content -->
  <div class="flex-grow-1 bg-light" style="margin-left: 250px; min-height: 100vh;">
    <div class="container-fluid p-4">

<div class="card border-0 shadow-sm p-4 mb-4">
  <h5>Tambah Slider Baru</h5>
  <div id="addAlert" class="alert d-none"></div>
  <form id="formAddSlider" class="row g-3">
    <div class="col-md-4">
      <label class="form-label">Gambar *</label>
      <input type="file" id="addGambarFile" class="form-control" required accept="image/*">
    </div>
    <div class="col-md-3">
      <label class="form-label">Judul</label>
      <input type="text" id="addJudul" class="form-control">
    </div>
    <div class="col-md-3">
      <label class="form-label">Deskripsi Singkat</label>
      <input type="text" id="addDeskripsi" class="form-control">
    </div>
    <div class="col-md-2">
      <label class="form-label">Urutan</label>
      <input type="number" id="addUrutan" class="form-control" value="0">
    </div>
    <div class="col-12">
      <button type="submit" class="btn btn-primary" id="btnAdd"><i class="bi bi-plus"></i> Tambah Slider</button>
    </div>
  </form>
</div>

<div class="row g-3" id="sliderContainer">
  <div class="col-12 text-center text-muted">
    <div class="spinner-border spinner-border-sm"></div> Memuat data slider...
  </div>
</div>

<div class="modal fade" id="modalEditSlider">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="formEditSlider">
        <div class="modal-header"><h5 class="modal-title">Edit Slider</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div id="editAlert" class="alert d-none"></div>
          <div class="mb-3"><label class="form-label">Ganti Gambar (kosongkan jika tidak ganti)</label><input type="file" id="editGambarFile" class="form-control" accept="image/*"></div>
          <div class="mb-3"><label class="form-label">Judul</label><input type="text" id="editJudul" class="form-control"></div>
          <div class="mb-3"><label class="form-label">Deskripsi</label><input type="text" id="editDeskripsi" class="form-control"></div>
          <div class="mb-3"><label class="form-label">Urutan</label><input type="number" id="editUrutan" class="form-control"></div>
        </div>
        <div class="modal-footer"><button type="submit" class="btn btn-primary" id="btnEditSave">Simpan</button></div>
      </form>
    </div>
  </div>
</div>

    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/src/dashboard/slider.js"></script>
</body>
</html>
