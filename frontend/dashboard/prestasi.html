<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin - UPUCC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<div class="d-flex">
  <!-- Sidebar -->
  <div class="bg-dark text-white p-3 vh-100 position-fixed" style="width: 250px; overflow-y:auto;">
    <h4 class="mb-4">Admin UPUCC</h4>
    <ul class="nav flex-column">
      <li class="nav-item"><a class="nav-link text-white" href="/dashboard/index.html">Dashboard</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="/dashboard/slider.html">Slider</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="/dashboard/informasi.html">Informasi UPUCC</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="/dashboard/divisi.html">Divisi</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="/dashboard/prestasi.html">Prestasi</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="/dashboard/struktur.html">Struktur</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="/dashboard/sejarah.html">Sejarah</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="/dashboard/acara.html">Acara</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="/dashboard/anggota.html">Anggota</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="/dashboard/pendaftaran.html">Pendaftaran</a></li>
      <li class="nav-item mt-4"><a class="nav-link text-danger" href="/dashboard/logout.html">Logout</a></li>
    </ul>
  </div>
  <!-- Main Content -->
  <div class="flex-grow-1 bg-light" style="margin-left: 250px; min-height: 100vh;">
    <div class="container-fluid p-4">

<div class="card border-0 shadow-sm p-4 mb-4">
  <h5>Tambah Prestasi</h5>
  <form method="POST" enctype="multipart/form-data" class="row g-3">
    <input type="hidden" name="action" value="add">
    <div class="col-md-4">
      <label class="form-label">Judul *</label>
      <input type="text" name="judul" class="form-control" required>
    </div>
    <div class="col-md-3">
      <label class="form-label">Divisi (kosongkan jika prestasi umum)</label>
      <select name="divisi_id" class="form-select">
        <option value="">-- Umum / Seluruh Divisi --</option>
        <option value="<!-- Dynamic: $d['id'] -->"><!-- Dynamic: e($d['nama']) --></option>
      </select>
    </div>
    <div class="col-md-2">
      <label class="form-label">Tanggal</label>
      <input type="date" name="tanggal" class="form-control">
    </div>
    <div class="col-md-3">
      <label class="form-label">Gambar</label>
      <input type="file" name="gambar" class="form-control" accept="image/*">
    </div>
    <div class="col-12">
      <label class="form-label">Deskripsi</label>
      <textarea name="deskripsi" class="form-control" rows="3"></textarea>
    </div>
    <div class="col-12"><button class="btn btn-primary"><i class="bi bi-plus"></i> Tambah</button></div>
  </form>
</div>

<div class="table-responsive">
<table class="table table-bordered bg-white align-middle">
<thead class="table-light"><tr><th>Gambar</th><th>Judul</th><th>Divisi</th><th>Tanggal</th><th>Aksi</th></tr></thead>
<tbody>

<tr>
  <td><img src="<!-- Dynamic: $p['gambar'] ? '../uploads/prestasi/'.e($p['gambar']) : 'https://via.placeholder.com/60' -->" style="width:60px;height:60px;object-fit:cover;"></td>
  <td><!-- Dynamic: e($p['judul']) --></td>
  <td><!-- Dynamic: e($p['divisi_nama'] ?? 'Umum') --></td>
  <td><!-- Dynamic: tgl_indo($p['tanggal']) --></td>
  <td>
    <button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#edit<!-- Dynamic: $p['id'] -->"><i class="bi bi-pencil"></i></button>
    <a href="?hapus=<!-- Dynamic: $p['id'] -->" class="btn btn-sm btn-outline-danger" onclick="return confirm('Hapus prestasi ini?')"><i class="bi bi-trash"></i></a>
  </td>
</tr>
<div class="modal fade" id="edit<!-- Dynamic: $p['id'] -->">
  <div class="modal-dialog">
    <div class="modal-content">
      <form method="POST" enctype="multipart/form-data">
        <input type="hidden" name="action" value="edit">
        <input type="hidden" name="id" value="<!-- Dynamic: $p['id'] -->">
        <div class="modal-header"><h5 class="modal-title">Edit Prestasi</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div class="mb-2"><label class="form-label">Judul</label><input type="text" name="judul" class="form-control" value="<!-- Dynamic: e($p['judul']) -->" required></div>
          <div class="mb-2"><label class="form-label">Divisi</label>
            <select name="divisi_id" class="form-select">
              <option value="">-- Umum --</option>
              <option value="<!-- Dynamic: $d['id'] -->" <!-- Dynamic: $p['divisi_id']==$d['id']?'selected':'' -->><!-- Dynamic: e($d['nama']) --></option>
            </select>
          </div>
          <div class="mb-2"><label class="form-label">Tanggal</label><input type="date" name="tanggal" class="form-control" value="<!-- Dynamic: e($p['tanggal']) -->"></div>
          <div class="mb-2"><label class="form-label">Gambar (kosongkan jika tidak ganti)</label><input type="file" name="gambar" class="form-control" accept="image/*"></div>
          <div class="mb-2"><label class="form-label">Deskripsi</label><textarea name="deskripsi" class="form-control" rows="3"><!-- Dynamic: e($p['deskripsi']) --></textarea></div>
        </div>
        <div class="modal-footer"><button class="btn btn-primary">Simpan</button></div>
      </form>
    </div>
  </div>
</div>

</tbody>
</table>
</div>

    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
