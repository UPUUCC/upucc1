<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin - UPUCC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<div class="d-flex">
  <!-- Sidebar -->
  <div class="bg-dark text-white p-3 vh-100 position-fixed" style="width: 250px; overflow-y:auto;">
    <h4 class="mb-4">Admin UPUCC</h4>
    <ul class="nav flex-column">
      <li class="nav-item"><a class="nav-link text-white" href="/dashboard/index.html">Dashboard</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="/dashboard/slider.html">Slider</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="/dashboard/informasi.html">Informasi UPUCC</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="/dashboard/divisi.html">Divisi</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="/dashboard/prestasi.html">Prestasi</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="/dashboard/struktur.html">Struktur</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="/dashboard/sejarah.html">Sejarah</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="/dashboard/acara.html">Acara</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="/dashboard/anggota.html">Anggota</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="/dashboard/pendaftaran.html">Pendaftaran</a></li>
      <li class="nav-item mt-4"><a class="nav-link text-danger" href="/dashboard/logout.html">Logout</a></li>
    </ul>
  </div>
  <!-- Main Content -->
  <div class="flex-grow-1 bg-light" style="margin-left: 250px; min-height: 100vh;">
    <div class="container-fluid p-4">

<div class="card border-0 shadow-sm p-4 mb-4">
  <h5>Tambah Prestasi</h5>
  <div id="addAlert" class="alert d-none"></div>
  <form id="formAddPrestasi" class="row g-3">
    <div class="col-md-4">
      <label class="form-label">Judul *</label>
      <input type="text" id="addJudul" class="form-control" required>
    </div>
    <div class="col-md-3">
      <label class="form-label">Divisi (kosongkan jika prestasi umum)</label>
      <select id="addDivisi" class="form-select">
        <option value="">-- Umum / Seluruh Divisi --</option>
      </select>
    </div>
    <div class="col-md-2">
      <label class="form-label">Tanggal</label>
      <input type="date" id="addTanggal" class="form-control">
    </div>
    <div class="col-md-3">
      <label class="form-label">Gambar</label>
      <input type="file" id="addGambarFile" class="form-control" accept="image/*">
    </div>
    <div class="col-12">
      <label class="form-label">Deskripsi</label>
      <textarea id="addDeskripsi" class="form-control" rows="3"></textarea>
    </div>
    <div class="col-12"><button type="submit" class="btn btn-primary" id="btnAdd"><i class="bi bi-plus"></i> Tambah</button></div>
  </form>
</div>

<div class="table-responsive">
  <table class="table table-bordered bg-white align-middle">
    <thead class="table-light"><tr><th>Gambar</th><th>Judul</th><th>Divisi</th><th>Tanggal</th><th>Aksi</th></tr></thead>
    <tbody id="prestasiTableBody">
      <tr><td colspan="5" class="text-center">Memuat data...</td></tr>
    </tbody>
  </table>
</div>

<!-- Modal Edit -->
<div class="modal fade" id="modalEditPrestasi">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="formEditPrestasi">
        <div class="modal-header"><h5 class="modal-title">Edit Prestasi</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div id="editAlert" class="alert d-none"></div>
          <div class="mb-2"><label class="form-label">Judul</label><input type="text" id="editJudul" class="form-control" required></div>
          <div class="mb-2"><label class="form-label">Divisi</label>
            <select id="editDivisi" class="form-select">
              <option value="">-- Umum --</option>
            </select>
          </div>
          <div class="mb-2"><label class="form-label">Tanggal</label><input type="date" id="editTanggal" class="form-control"></div>
          <div class="mb-2"><label class="form-label">Gambar (kosongkan jika tidak ganti)</label><input type="file" id="editGambarFile" class="form-control" accept="image/*"></div>
          <div class="mb-2"><label class="form-label">Deskripsi</label><textarea id="editDeskripsi" class="form-control" rows="3"></textarea></div>
        </div>
        <div class="modal-footer"><button type="submit" class="btn btn-primary" id="btnEditSave">Simpan</button></div>
      </form>
    </div>
  </div>
</div>

    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/src/dashboard/prestasi.js"></script>
</body>
</html>
