<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog & Artikel Teknologi - UPU-CC</title>

  <link rel="icon" type="image/jpeg" href="/logo.jpg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  
  <style>
    body { background-color: #f8fafc; font-family: 'Outfit', sans-serif; }
    .blog-header {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      color: white;
      padding: 80px 0;
      text-align: center;
    }
    .blog-card {
        border: none;
        border-radius: 16px;
        overflow: hidden;
        transition: transform 0.3s, box-shadow 0.3s;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    .blog-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    .blog-card img {
        height: 200px;
        object-fit: cover;
    }
    .badge-category {
        position: absolute;
        top: 15px;
        left: 15px;
        background: rgba(15, 23, 42, 0.8);
        color: white;
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 0.8rem;
        backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #0f172a;">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/">
      <img src="/logo.jpg" alt="Logo UPU-CC" height="30" class="me-2 rounded-circle"> UPU-CC
    </a>
    <a href="/" class="btn btn-sm btn-outline-light ms-auto"><i class="bi bi-house"></i> Beranda</a>
  </div>
</nav>

<div class="blog-header">
  <div class="container">
    <h1 class="fw-bold mb-3">UPU-CC Tech Blog</h1>
    <p class="lead opacity-75">Tutorial, Berita Teknologi, dan Karya Tulis Mahasiswa</p>
  </div>
</div>

<div class="container my-5">
    <div class="row g-4" id="blogContainer">
        
        <div class="col-12 text-center py-5" id="loadingBlog">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="text-muted mt-3">Memuat artikel...</p>
        </div>
    </div>
</div>

<script type="module" src="/src/blog.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
